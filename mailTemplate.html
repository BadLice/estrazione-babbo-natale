<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>Estrazione Babbo Natale Segreto</title>
  <style type="text/css">
    :root {
      color-scheme: light dark;
      supported-color-schemes: light dark;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: #0b1a2d !important;
    }
    body, table, td, p, div, span {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif !important;
    }
    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      outline: none;
      text-decoration: none;
    }
    /* Mobile full-width scaling to eliminate white side borders */
    @media only screen and (max-width: 480px) {
      .email-container {
        width: 100% !important;
        max-width: 100% !important;
      }
      .name-text {
        font-size: 24px !important;
      }
    }
    /* Blend-mode dark mode anti-inversion for Gmail on iOS & Android */
    @media screen and (max-width: 600px) {
      u + .body .gmail-blend-screen {
        background-color: #000000;
        mix-blend-mode: screen;
        display: inline-block;
      }
      u + .body .gmail-blend-diff-white {
        background-color: #000000;
        mix-blend-mode: difference;
        display: inline-block;
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
      }
      u + .body .gmail-blend-diff-gold {
        background-color: #000000;
        mix-blend-mode: difference;
        display: inline-block;
        color: #dca842 !important;
        -webkit-text-fill-color: #dca842 !important;
      }
    }
    /* Standard Dark Mode overrides */
    @media (prefers-color-scheme: dark) {
      .force-white {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
      }
      .force-gold {
        color: #dca842 !important;
        -webkit-text-fill-color: #dca842 !important;
      }
      .name-text {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
      }
    }
  </style>
</head>
<body class="body" style="margin:0; padding:0; background-color:#0b1a2d; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">

  <!-- Outer centering wrapper -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#0b1a2d; margin:0; padding:0;">
    <tr>
      <td align="center" valign="top" style="padding:0; background-color:#0b1a2d;">

        <!--[if gte mso 9]>
        <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:360px; height:640px;">
          <v:fill type="frame" src="cid:bgimage" color="#0b1a2d" />
          <v:textbox inset="0,0,0,0" style="mso-fit-shape-to-text:true;">
        <![endif]-->

        <!-- 360x640 canvas (desktop 360px 9:16, mobile edge-to-edge) -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="360" height="640" background="cid:bgimage" class="email-container" style="width:360px; max-width:360px; height:640px; background-color:#0b1a2d; background-image:url('cid:bgimage'); background-size:100% 100%; background-position:center top; background-repeat:no-repeat; margin:0 auto; border-collapse:collapse;">

          <!-- 1. TOP SECTION: Title, greeting, assignment and kid name -->
          <tr>
            <td align="center" valign="top" style="height:175px; padding:44px 16px 0 16px;">

              <!-- Title in warm gold -->
              <div class="force-gold" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:12px; font-weight:700; color:#dca842; letter-spacing:2px; text-transform:uppercase; line-height:1.3; margin:0 0 10px 0;">
                <span class="gmail-blend-screen"><span class="gmail-blend-diff-gold">ESTRAZIONE BABBO NATALE SEGRETO</span></span>
              </div>

              <!-- Greeting -->
              <div class="force-white" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:14px; font-weight:400; color:#ffffff; line-height:1.4; margin:0 0 4px 0;">
                <span class="gmail-blend-screen"><span class="gmail-blend-diff-white">Ciao %NAME%,</span></span>
              </div>

              <!-- Secret notice -->
              <div class="force-white" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:13px; font-weight:400; color:#ffffff; line-height:1.4; margin:0 0 10px 0;">
                <span class="gmail-blend-screen"><span class="gmail-blend-diff-white">Questa mail &egrave; SEGRETA, non farla vedere a NESSUNO!</span></span>
              </div>

              <!-- Sarai il BABBO NATALE di -->
              <div class="force-white" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:16px; font-weight:600; color:#ffffff; line-height:1.3; margin:0 0 4px 0;">
                <span class="gmail-blend-screen"><span class="gmail-blend-diff-white">Sarai il BABBO NATALE di</span></span>
              </div>

              <!-- Kid Name: pure clean extra-bold sans-serif -->
              <div class="name-text" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:26px; font-weight:800; color:#ffffff; text-transform:uppercase; letter-spacing:1px; line-height:1.15; margin:0;">
                <span class="gmail-blend-screen"><span class="gmail-blend-diff-white">%KID%</span></span>
              </div>

              <!-- Gold accent line -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:5px auto 0 auto;">
                <tr>
                  <td style="width:130px; height:2px; background-color:#dca842; font-size:0; line-height:0; border-radius:2px;">&nbsp;</td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- 2. MIDDLE SPACER: Clears Santa and sleigh while positioning Elfo section comfortably above roofs -->
          <tr>
            <td style="height:165px; font-size:0; line-height:0;">&nbsp;</td>
          </tr>

          <!-- 3. ELFO AIUTANTE SECTION: Clears rooftops below -->
          <tr>
            <td align="center" valign="top" style="height:70px; padding:0 16px;">

              <!-- Il tuo ELFO AIUTANTE sarà -->
              <div class="force-white" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:15px; font-weight:600; color:#ffffff; line-height:1.3; margin:0 0 4px 0;">
                <span class="gmail-blend-screen"><span class="gmail-blend-diff-white">Il tuo ELFO AIUTANTE sar&agrave;</span></span>
              </div>

              <!-- Advicer Name: pure clean extra-bold sans-serif -->
              <div class="name-text" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:26px; font-weight:800; color:#ffffff; text-transform:uppercase; letter-spacing:1px; line-height:1.15; margin:0;">
                <span class="gmail-blend-screen"><span class="gmail-blend-diff-white">%ADVICER%</span></span>
              </div>

              <!-- Gold accent line -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:5px auto 0 auto;">
                <tr>
                  <td style="width:130px; height:2px; background-color:#dca842; font-size:0; line-height:0; border-radius:2px;">&nbsp;</td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- 4. BOTTOM SPACER: Shows village rooftops and snow ground -->
          <tr>
            <td style="height:160px; font-size:0; line-height:0;">&nbsp;</td>
          </tr>

        </table>

        <!--[if gte mso 9]>
          </v:textbox>
        </v:rect>
        <![endif]-->

      </td>
    </tr>
  </table>

</body>
</html>
